<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your number — GEN C</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/design-system.css" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ── Reset & base ───────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Wrapper ────────────────────────────────── */
    .otp-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Back link (top-left of the column) ─────── */
    .back-row {
      width: 100%;
      margin-bottom: 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748B;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.15s;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: #2563EB;
      outline: none;
    }

    .back-link:focus-visible {
      outline: 2px solid #2563EB;
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ── Logo ───────────────────────────────────── */
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: #2563EB;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: #2563EB;
      letter-spacing: -0.5px;
    }

    /* ── Shield icon ────────────────────────────── */
    .shield-icon {
      width: 64px;
      height: 64px;
      background: #EFF6FF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: #2563EB;
    }

    .shield-icon svg {
      width: 32px;
      height: 32px;
    }

    /* ── Heading block ──────────────────────────── */
    .heading-block {
      text-align: center;
      margin-bottom: 32px;
    }

    .heading-block h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .heading-block p {
      font-size: 14px;
      color: #64748B;
      line-height: 1.6;
    }

    /* ── OTP group ──────────────────────────────── */
    .otp-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 8px;
      width: 100%;
    }

    .otp-input {
      width: 52px;
      height: 60px;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      background: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #0F172A;
      text-align: center;
      caret-color: #2563EB;
      transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .otp-input:focus {
      border-color: #2563EB;
      background: #EFF6FF;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .otp-input.filled {
      border-color: #2563EB;
      background: #EFF6FF;
    }

    .otp-input.error {
      border-color: #DC2626;
      background: #FEF2F2;
      color: #DC2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.10);
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-5px); }
      40%       { transform: translateX(5px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    /* ── Error message ──────────────────────────── */
    .otp-error {
      font-size: 13px;
      color: #DC2626;
      text-align: center;
      min-height: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .otp-error.visible {
      visibility: visible;
      opacity: 1;
    }

    .otp-error svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ── Verify button ──────────────────────────── */
    .btn-verify {
      width: 100%;
      height: 52px;
      background: #2563EB;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      transition: background-color 0.15s, opacity 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .btn-verify:hover:not(:disabled) {
      background: #1D4ED8;
    }

    .btn-verify:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-verify:focus-visible {
      outline: 2px solid #2563EB;
      outline-offset: 3px;
    }

    .btn-verify:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Spinner inside button */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
      flex-shrink: 0;
    }

    .btn-verify.loading .spinner {
      display: block;
    }

    .btn-verify.loading .btn-label {
      opacity: 0.8;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Resend block ───────────────────────────── */
    .resend-block {
      text-align: center;
      font-size: 14px;
      color: #64748B;
      line-height: 1.6;
    }

    .resend-block .resend-btn {
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }

    .resend-btn.disabled {
      color: #94A3B8;
      cursor: not-allowed;
      font-weight: 500;
    }

    .resend-btn.active {
      color: #2563EB;
    }

    .resend-btn.active:hover,
    .resend-btn.active:focus-visible {
      color: #1D4ED8;
      text-decoration: underline;
      outline: none;
    }

    .resend-btn.active:focus-visible {
      outline: 2px solid #2563EB;
      outline-offset: 2px;
      border-radius: 2px;
    }

    .resend-confirm {
      font-size: 13px;
      color: #16A34A;
      font-weight: 500;
      margin-top: 8px;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .resend-confirm.show {
      opacity: 1;
    }

    .resend-confirm svg {
      width: 14px;
      height: 14px;
    }

    /* ── Mobile tweaks ──────────────────────────── */
    @media (max-width: 420px) {
      .otp-input {
        width: 44px;
        height: 54px;
        font-size: 20px;
        border-radius: 10px;
      }

      .otp-group {
        gap: 8px;
      }
    }

    @media (max-width: 340px) {
      .otp-input {
        width: 38px;
        height: 48px;
        font-size: 18px;
      }

      .otp-group {
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <div class="otp-wrapper" role="main">

    <!-- Back arrow -->
    <div class="back-row">
      <a href="signup.html" class="back-link" aria-label="Back to sign up">
        <i data-lucide="arrow-left" style="width:18px;height:18px;"></i>
        Back
      </a>
    </div>

    <!-- Logo -->
    <a href="index.html" class="logo" aria-label="GEN C Home">
      <div class="logo-icon" aria-hidden="true">
        <i data-lucide="zap"></i>
      </div>
      <span class="logo-text">GEN C</span>
    </a>

    <!-- Shield icon -->
    <div class="shield-icon" aria-hidden="true">
      <i data-lucide="shield-check"></i>
    </div>

    <!-- Heading -->
    <div class="heading-block">
      <h1>Verify your number</h1>
      <p>Enter the 6-digit code sent to<br /><strong>+234 ••• ••• 7890</strong></p>
    </div>

    <!-- OTP Input Group -->
    <div
      class="otp-group"
      role="group"
      aria-label="Verification code"
      id="otp-group"
    >
      <input
        class="otp-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]"
        maxlength="1"
        autocomplete="one-time-code"
        aria-label="Digit 1"
        id="otp-1"
        data-index="0"
      />
      <input
        class="otp-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]"
        maxlength="1"
        aria-label="Digit 2"
        id="otp-2"
        data-index="1"
      />
      <input
        class="otp-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]"
        maxlength="1"
        aria-label="Digit 3"
        id="otp-3"
        data-index="2"
      />
      <input
        class="otp-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]"
        maxlength="1"
        aria-label="Digit 4"
        id="otp-4"
        data-index="3"
      />
      <input
        class="otp-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]"
        maxlength="1"
        aria-label="Digit 5"
        id="otp-5"
        data-index="4"
      />
      <input
        class="otp-input"
        type="text"
        inputmode="numeric"
        pattern="[0-9]"
        maxlength="1"
        aria-label="Digit 6"
        id="otp-6"
        data-index="5"
      />
    </div>

    <!-- Error message -->
    <div
      class="otp-error"
      id="otp-error"
      role="alert"
      aria-live="polite"
    >
      <i data-lucide="alert-circle"></i>
      <span id="otp-error-text">Invalid code. Please try again.</span>
    </div>

    <!-- Verify button -->
    <button
      class="btn-verify"
      id="btn-verify"
      type="button"
      aria-label="Verify code"
    >
      <div class="spinner" aria-hidden="true"></div>
      <span class="btn-label">Verify code</span>
    </button>

    <!-- Resend block -->
    <div class="resend-block" aria-live="polite">
      <span>Didn't receive a code?&nbsp;</span>
      <button
        class="resend-btn disabled"
        id="resend-btn"
        type="button"
        disabled
        aria-label="Resend code, available in 30 seconds"
      >
        Resend in <span id="resend-countdown">30</span>s
      </button>
      <div class="resend-confirm" id="resend-confirm" aria-live="polite">
        <i data-lucide="check-circle-2"></i>
        Code resent
      </div>
    </div>

  </div><!-- /.otp-wrapper -->

  <script>
    // ─── DOM refs ──────────────────────────────────────────────────────────────
    const inputs       = Array.from(document.querySelectorAll('.otp-input'));
    const btnVerify    = document.getElementById('btn-verify');
    const errorEl      = document.getElementById('otp-error');
    const errorTextEl  = document.getElementById('otp-error-text');
    const resendBtn    = document.getElementById('resend-btn');
    const countdownEl  = document.getElementById('resend-countdown');
    const confirmEl    = document.getElementById('resend-confirm');

    // ─── Helpers ───────────────────────────────────────────────────────────────
    function getOTPValue() {
      return inputs.map(i => i.value).join('');
    }

    function setError(msg) {
      errorTextEl.textContent = msg;
      errorEl.classList.add('visible');
      inputs.forEach(i => i.classList.add('error'));
      inputs.forEach(i => {
        i.setAttribute('aria-describedby', 'otp-error');
      });
    }

    function clearError() {
      errorEl.classList.remove('visible');
      inputs.forEach(i => {
        i.classList.remove('error');
        i.removeAttribute('aria-describedby');
      });
    }

    function updateFilledState(input) {
      if (input.value) {
        input.classList.add('filled');
      } else {
        input.classList.remove('filled');
      }
    }

    // ─── OTP Input: keydown ────────────────────────────────────────────────────
    inputs.forEach((input, idx) => {
      // Only allow numeric characters
      input.addEventListener('keydown', (e) => {
        // Allow: backspace, delete, tab, arrows
        const allowed = ['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
        if (allowed.includes(e.key)) {
          if (e.key === 'Backspace') {
            e.preventDefault();
            if (input.value) {
              input.value = '';
              updateFilledState(input);
              clearError();
            } else if (idx > 0) {
              inputs[idx - 1].focus();
              inputs[idx - 1].value = '';
              updateFilledState(inputs[idx - 1]);
              clearError();
            }
          }
          if (e.key === 'ArrowLeft' && idx > 0) {
            e.preventDefault();
            inputs[idx - 1].focus();
          }
          if (e.key === 'ArrowRight' && idx < inputs.length - 1) {
            e.preventDefault();
            inputs[idx + 1].focus();
          }
          return;
        }
        // Block non-numeric
        if (!/^[0-9]$/.test(e.key)) {
          e.preventDefault();
        }
      });

      // On input (after keydown allows it)
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        input.value = val ? val[val.length - 1] : '';
        updateFilledState(input);
        clearError();

        if (input.value && idx < inputs.length - 1) {
          inputs[idx + 1].focus();
        }

        // Auto-submit when all filled (optional: user must click button instead)
        // Uncomment if desired:
        // if (getOTPValue().length === 6) btnVerify.focus();
      });

      // On focus: select existing content
      input.addEventListener('focus', () => {
        input.select();
      });

      // Paste handling
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text');
        const digits = text.replace(/[^0-9]/g, '').slice(0, 6);
        if (!digits) return;

        digits.split('').forEach((d, i) => {
          if (inputs[i]) {
            inputs[i].value = d;
            updateFilledState(inputs[i]);
          }
        });
        // Focus last filled or first empty
        const focusIdx = Math.min(digits.length, inputs.length - 1);
        inputs[focusIdx].focus();
        clearError();
      });
    });

    // ─── Verify button ─────────────────────────────────────────────────────────
    btnVerify.addEventListener('click', () => {
      const otp = getOTPValue();

      if (otp.length < 6) {
        setError('Please enter all 6 digits.');
        // Focus first empty
        const firstEmpty = inputs.find(i => !i.value);
        if (firstEmpty) firstEmpty.focus();
        return;
      }

      clearError();

      // Demo: any 6 digits succeed
      // Show loading
      btnVerify.disabled = true;
      btnVerify.classList.add('loading');
      btnVerify.querySelector('.btn-label').textContent = 'Verifying…';

      setTimeout(() => {
        window.location.href = 'account-created.html';
      }, 1200);
    });

    // ─── Resend countdown ──────────────────────────────────────────────────────
    let countdownTimer = null;
    let secondsLeft = 30;

    function startCountdown() {
      secondsLeft = 30;
      countdownEl.textContent = secondsLeft;
      resendBtn.disabled = true;
      resendBtn.classList.remove('active');
      resendBtn.classList.add('disabled');
      resendBtn.setAttribute('aria-label', `Resend code, available in ${secondsLeft} seconds`);
      resendBtn.innerHTML = `Resend in <span id="resend-countdown">${secondsLeft}</span>s`;

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        secondsLeft--;
        const cd = resendBtn.querySelector('span') || document.getElementById('resend-countdown');
        if (cd) cd.textContent = secondsLeft;

        if (secondsLeft <= 0) {
          clearInterval(countdownTimer);
          resendBtn.disabled = false;
          resendBtn.classList.remove('disabled');
          resendBtn.classList.add('active');
          resendBtn.textContent = 'Resend code';
          resendBtn.setAttribute('aria-label', 'Resend verification code');
        } else {
          resendBtn.setAttribute('aria-label', `Resend code, available in ${secondsLeft} seconds`);
        }
      }, 1000);
    }

    resendBtn.addEventListener('click', () => {
      if (resendBtn.disabled) return;

      // Show confirmation
      confirmEl.classList.add('show');
      setTimeout(() => confirmEl.classList.remove('show'), 3000);

      // Clear OTP inputs
      inputs.forEach(i => {
        i.value = '';
        i.classList.remove('filled', 'error');
      });
      clearError();
      inputs[0].focus();

      startCountdown();
    });

    // Kick off countdown on load
    startCountdown();

    // ─── Focus first input on load ─────────────────────────────────────────────
    window.addEventListener('load', () => {
      inputs[0].focus();
    });

    // ─── Init Lucide icons ────────────────────────────────────────────────────
    lucide.createIcons();
  </script>
</body>
</html>
