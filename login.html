<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to your GEN C account. Manage your money with full control." />
  <title>Log in — GEN C</title>

  <!-- Design System -->
  <link rel="stylesheet" href="assets/css/design-system.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <style>
    /* ── Auth Shell ─────────────────────────────────────── */
    .auth-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
    }

    @media (min-width: 1024px) {
      .auth-shell {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* ── Brand Panel (left) ──────────────────────────────── */
    .brand-panel {
      display: none;
      position: relative;
      background: var(--color-dark-navy);
      padding: var(--space-10) var(--space-12);
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 1024px) {
      .brand-panel {
        display: flex;
      }
    }

    /* Subtle CSS background pattern — minimal dot grid */
    .brand-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* Subtle vignette at edges */
    .brand-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 0% 0%, rgba(37,99,235,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 100% 100%, rgba(37,99,235,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .brand-panel__logo {
      position: relative;
      z-index: 1;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      text-decoration: none;
    }

    .brand-logo__mark {
      width: 36px;
      height: 36px;
      background: var(--color-primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-logo__mark svg {
      width: 20px;
      height: 20px;
      color: #ffffff;
    }

    .brand-logo__text {
      font-size: var(--font-size-xl);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1;
    }

    /* Blue variant for form panel */
    .brand-logo--blue .brand-logo__text {
      color: var(--color-primary);
    }

    .brand-logo--blue .brand-logo__mark {
      background: var(--color-primary);
    }

    .brand-panel__body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 1;
      padding-block: var(--space-16);
    }

    .brand-panel__eyebrow {
      display: inline-block;
      font-size: var(--font-size-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: var(--space-5);
    }

    .brand-panel__headline {
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: #ffffff;
      margin-bottom: var(--space-6);
    }

    .brand-panel__sub {
      font-size: var(--font-size-lg);
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
      max-width: 28ch;
    }

    /* Decorative accent line */
    .brand-panel__accent {
      width: 48px;
      height: 3px;
      background: var(--color-primary);
      border-radius: var(--radius-full);
      margin-bottom: var(--space-8);
    }

    /* ── Form Panel (right) ──────────────────────────────── */
    .form-panel {
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
      padding: var(--space-8) var(--space-6);
      overflow-y: auto;
    }

    @media (min-width: 480px) {
      .form-panel {
        padding: var(--space-10) var(--space-8);
      }
    }

    @media (min-width: 1024px) {
      .form-panel {
        padding: var(--space-12) clamp(var(--space-10), 8%, 5rem);
      }
    }

    .form-panel__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-10);
    }

    /* Logo only shows on mobile (brand panel is hidden there) */
    .form-panel__logo {
      display: flex;
    }

    @media (min-width: 1024px) {
      .form-panel__logo {
        display: none;
      }
    }

    .form-panel__back {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--font-size-sm);
      font-weight: 500;
      color: var(--color-muted);
      text-decoration: none;
      transition: color var(--transition-fast);
      margin-left: auto;
    }

    .form-panel__back:hover {
      color: var(--color-text);
      text-decoration: none;
    }

    .form-panel__back svg {
      width: 15px;
      height: 15px;
    }

    .form-panel__content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
    }

    /* Heading cluster */
    .form-heading {
      margin-bottom: var(--space-8);
    }

    .form-heading__title {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-text);
      margin-bottom: var(--space-2);
      line-height: 1.2;
    }

    @media (min-width: 480px) {
      .form-heading__title {
        font-size: var(--font-size-3xl);
      }
    }

    .form-heading__sub {
      font-size: var(--font-size-sm);
      color: var(--color-muted);
      line-height: 1.6;
    }

    .form-heading__sub a {
      font-weight: 600;
    }

    /* Auth form */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    /* Forgot password row */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: calc(var(--space-1) * -1);
    }

    .forgot-link {
      font-size: var(--font-size-xs);
      font-weight: 500;
      color: var(--color-primary);
    }

    /* Submit wrapper */
    .submit-wrapper {
      margin-top: var(--space-2);
    }

    .btn-primary .btn-label {
      transition: opacity var(--transition-fast);
    }

    .btn-primary.is-loading .btn-label {
      opacity: 0.85;
    }

    /* Alert banner (for server errors) */
    .alert-banner {
      display: none;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      line-height: 1.5;
    }

    .alert-banner.error {
      background: var(--color-error-light);
      color: var(--color-error);
      border: 1px solid #FECACA;
    }

    .alert-banner.visible {
      display: flex;
    }

    .alert-banner svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Footer links */
    .form-footer {
      margin-top: var(--space-8);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-border);
      text-align: center;
    }

    .form-footer p {
      font-size: var(--font-size-xs);
      color: var(--color-muted);
    }
  </style>
</head>
<body>

<div class="auth-shell">

  <!-- ══ BRAND PANEL (left, desktop only) ══════════════════ -->
  <aside class="brand-panel" aria-hidden="true">
    <div class="brand-panel__logo">
      <span class="brand-logo" aria-label="GEN C">
        <span class="brand-logo__mark">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 2L2 7l8 5 8-5-8-5z"/>
            <path d="M2 12l8 5 8-5"/>
          </svg>
        </span>
        <span class="brand-logo__text">GEN C</span>
      </span>
    </div>

    <div class="brand-panel__body">
      <span class="brand-panel__eyebrow">Fintech · 2026</span>
      <div class="brand-panel__accent"></div>
      <h1 class="brand-panel__headline">Welcome<br />back.</h1>
      <p class="brand-panel__sub">Your money. Your control.</p>
    </div>
  </aside>

  <!-- ══ FORM PANEL (right) ════════════════════════════════ -->
  <main class="form-panel" id="main-content">
    <div class="form-panel__top">
      <!-- Logo — visible only on mobile -->
      <div class="form-panel__logo" aria-label="GEN C">
        <a href="index.html" class="brand-logo brand-logo--blue">
          <span class="brand-logo__mark">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 2L2 7l8 5 8-5-8-5z"/>
              <path d="M2 12l8 5 8-5"/>
            </svg>
          </span>
          <span class="brand-logo__text">GEN C</span>
        </a>
      </div>

      <a href="index.html" class="form-panel__back" aria-label="Back to home">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        Home
      </a>
    </div>

    <div class="form-panel__content">

      <!-- Heading -->
      <div class="form-heading">
        <h2 class="form-heading__title">Log in to your account</h2>
        <p class="form-heading__sub">
          New to GEN C?
          <a href="signup.html">Sign up</a>
        </p>
      </div>

      <!-- Alert banner -->
      <div
        class="alert-banner error"
        id="form-alert"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <i data-lucide="alert-circle" aria-hidden="true"></i>
        <span id="form-alert-text"></span>
      </div>

      <!-- Login Form -->
      <form
        class="auth-form"
        id="login-form"
        novalidate
        aria-label="Login form"
      >

        <!-- Email -->
        <div class="form-group" id="group-email">
          <label class="form-label" for="email">
            Email address
            <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="email-error"
              placeholder="you@example.com"
              inputmode="email"
            />
          </div>
          <span
            class="field-message error"
            id="email-error"
            role="alert"
            aria-live="polite"
            hidden
          >
            <i data-lucide="alert-circle" aria-hidden="true"></i>
            <span id="email-error-text"></span>
          </span>
        </div>

        <!-- Password -->
        <div class="form-group" id="group-password">
          <label class="form-label" for="password">
            Password
            <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input has-toggle"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="password-error"
              placeholder="Enter your password"
            />
            <button
              type="button"
              class="input-toggle"
              id="password-toggle"
              aria-label="Show password"
              aria-controls="password"
              aria-pressed="false"
            >
              <i data-lucide="eye" aria-hidden="true" id="toggle-icon-password"></i>
            </button>
          </div>
          <span
            class="field-message error"
            id="password-error"
            role="alert"
            aria-live="polite"
            hidden
          >
            <i data-lucide="alert-circle" aria-hidden="true"></i>
            <span id="password-error-text"></span>
          </span>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-row">
          <a href="forgot-password.html" class="forgot-link">
            Forgot password?
          </a>
        </div>

        <!-- Submit -->
        <div class="submit-wrapper">
          <button
            type="submit"
            class="btn btn-primary btn-full"
            id="login-btn"
            aria-describedby="form-alert"
          >
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Log in</span>
          </button>
        </div>

      </form>

      <!-- Footer -->
      <footer class="form-footer">
        <p>By logging in you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
      </footer>

    </div>
  </main>

</div><!-- /auth-shell -->

<script>
  /* ── Lucide icons ───────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    if (window.lucide) lucide.createIcons();
  });

  /* ── Password show/hide ─────────────────────────────────── */
  (function () {
    const toggleBtn = document.getElementById('password-toggle');
    const passwordInput = document.getElementById('password');

    if (!toggleBtn || !passwordInput) return;

    toggleBtn.addEventListener('click', function () {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      toggleBtn.setAttribute('aria-pressed', isHidden ? 'true' : 'false');

      /* Swap icon */
      const icon = document.getElementById('toggle-icon-password');
      if (icon) {
        icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
        if (window.lucide) lucide.createIcons();
      }
    });
  })();

  /* ── Validation helpers ─────────────────────────────────── */
  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  }

  function showFieldError(inputEl, errorContainerEl, errorTextEl, message) {
    inputEl.classList.add('is-error');
    inputEl.setAttribute('aria-invalid', 'true');
    errorContainerEl.hidden = false;
    errorTextEl.textContent = message;
    if (window.lucide) lucide.createIcons();
  }

  function clearFieldError(inputEl, errorContainerEl) {
    inputEl.classList.remove('is-error');
    inputEl.removeAttribute('aria-invalid');
    errorContainerEl.hidden = true;
  }

  function showFormAlert(message) {
    const banner = document.getElementById('form-alert');
    const text   = document.getElementById('form-alert-text');
    text.textContent = message;
    banner.classList.add('visible');
    if (window.lucide) lucide.createIcons();
    banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function hideFormAlert() {
    document.getElementById('form-alert').classList.remove('visible');
  }

  /* ── Live validation (on blur) ──────────────────────────── */
  const emailInput    = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  emailInput.addEventListener('blur', () => {
    const emailError     = document.getElementById('email-error');
    const emailErrorText = document.getElementById('email-error-text');
    if (!emailInput.value.trim()) {
      showFieldError(emailInput, emailError, emailErrorText, 'Email address is required.');
    } else if (!isValidEmail(emailInput.value)) {
      showFieldError(emailInput, emailError, emailErrorText, 'Please enter a valid email address.');
    } else {
      clearFieldError(emailInput, emailError);
    }
  });

  emailInput.addEventListener('input', () => {
    if (emailInput.classList.contains('is-error') && isValidEmail(emailInput.value)) {
      clearFieldError(emailInput, document.getElementById('email-error'));
    }
  });

  passwordInput.addEventListener('blur', () => {
    const passError     = document.getElementById('password-error');
    const passErrorText = document.getElementById('password-error-text');
    if (!passwordInput.value) {
      showFieldError(passwordInput, passError, passErrorText, 'Password is required.');
    } else {
      clearFieldError(passwordInput, passError);
    }
  });

  passwordInput.addEventListener('input', () => {
    if (passwordInput.classList.contains('is-error') && passwordInput.value) {
      clearFieldError(passwordInput, document.getElementById('password-error'));
    }
  });

  /* ── Form submission ────────────────────────────────────── */
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    hideFormAlert();

    const emailError     = document.getElementById('email-error');
    const emailErrorText = document.getElementById('email-error-text');
    const passError      = document.getElementById('password-error');
    const passErrorText  = document.getElementById('password-error-text');

    let valid = true;

    /* Validate email */
    if (!emailInput.value.trim()) {
      showFieldError(emailInput, emailError, emailErrorText, 'Email address is required.');
      valid = false;
    } else if (!isValidEmail(emailInput.value)) {
      showFieldError(emailInput, emailError, emailErrorText, 'Please enter a valid email address.');
      valid = false;
    } else {
      clearFieldError(emailInput, emailError);
    }

    /* Validate password */
    if (!passwordInput.value) {
      showFieldError(passwordInput, passError, passErrorText, 'Password is required.');
      valid = false;
    } else {
      clearFieldError(passwordInput, passError);
    }

    if (!valid) {
      /* Focus first error field */
      const firstError = this.querySelector('[aria-invalid="true"]');
      if (firstError) firstError.focus();
      return;
    }

    /* Simulate loading + redirect */
    const btn = document.getElementById('login-btn');
    btn.classList.add('is-loading');
    btn.setAttribute('aria-disabled', 'true');
    btn.disabled = true;
    btn.querySelector('.btn-label').textContent = 'Logging in…';

    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 1200);
  });
</script>

</body>
</html>
